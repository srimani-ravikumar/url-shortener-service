# Serves the built Angular app under /app/. The public nginx (deploy/nginx/default.conf) forwards /app/ here.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Nothing but our own files: no third-party scripts, fonts or frames. 'unsafe-inline' for styles is needed
    # because Angular writes each component's styles into <style> tags at run time.
    # (add_header in a location replaces the ones set here, so security-headers.conf is included in each location.)
    include /etc/nginx/snippets/security-headers.conf;

    # For the compose health check.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /app {
        return 301 /app/;
    }

    # Built files have a hash in their name, so they never change under the same name.
    # No "always": a missing file (404) must not be cached for a year.
    location ~ ^/app/.+\.(js|css|woff2?|png|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other address is a page of the single-page app: serve index.html and let the router decide.
    # It is never cached, so a new release is picked up at once.
    location /app/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /app/index.html;
    }
}
