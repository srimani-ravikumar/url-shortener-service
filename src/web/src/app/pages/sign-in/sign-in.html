<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Paste your API key to manage your links.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="api-key">API key</label>
      <!-- type=password keeps the key off the screen while it is typed or pasted. -->
      <input
        id="api-key"
        type="password"
        formControlName="apiKey"
        autocomplete="off"
        spellcheck="false"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="error() ? 'api-key-error' : null"
      />
      @if (error()) {
        <p class="field-error" id="api-key-error" role="alert">{{ error() }}</p>
      }
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="busy()">Sign in</button>
  </form>

  <p class="muted">
    No key yet? <a routerLink="/signup">Get one</a>. Lost it? <a routerLink="/recover">Get a new one</a>.
  </p>
</section>
