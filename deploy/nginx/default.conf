# The only public entry point: routes API calls to the shortener and everything else to the redirector.

# The access log also names the service replica that answered, which shows how traffic is spread.
log_format with_upstream '$remote_addr [$time_local] "$request" $status $request_time upstream=$upstream_addr';

server {
    listen 80;
    access_log /dev/stdout with_upstream;

    # Docker's DNS. Using variables in proxy_pass makes nginx re-resolve the names every few seconds,
    # so redirector replicas added with `--scale` are picked up and traffic is spread across all of them.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $shortener_upstream http://shortener-api:8080;
    set $redirector_upstream http://redirector-api:8080;

    # The shortener refuses bodies over 16 KB anyway; reject them here before they are forwarded.
    client_max_body_size 16k;

    # Tell the services who the real caller is. The services trust these headers because only nginx can reach them;
    # $remote_addr (not the caller's own X-Forwarded-For) stops clients from faking their address.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Proxy's own liveness: no upstream involved.
    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"Healthy"}';
    }

    # Readiness reflects the redirect path, which is what the proxy exists to serve.
    location = /health/ready {
        proxy_pass $redirector_upstream;
    }

    # Service health endpoints stay internal.
    location /health/ {
        return 404;
    }

    location /api/ {
        proxy_pass $shortener_upstream;
    }

    # Everything else is a short code (a /health or /api look-alike can never be one: those words are reserved).
    location / {
        proxy_pass $redirector_upstream;
    }
}
