# Single-binary Tempo for local development. Data lives under /tmp, so it is lost when the container is recreated.
# Pinned to 2.6.1: Tempo 3.x changed the configuration schema.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
